# =============================================================================
# AUTH SERVICE - PRODUCTION VALUES
# =============================================================================
# CRITICAL SERVICE: Handles authentication, JWT tokens, sessions
# Default values are PRODUCTION-READY
# =============================================================================
auth:
  label: auth
  # ---------------------------------------------------------------------------

  # Replicas - Reduced for dev/small clusters
  # ---------------------------------------------------------------------------
  replicas: 1
  containerPort: 9030
  # ---------------------------------------------------------------------------

  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/auth-service
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------

  # RESOURCES - Reduced for t3.medium nodes
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ---------------------------------------------------------------------------

  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------

  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 9030
  # ---------------------------------------------------------------------------

  # POD DISRUPTION BUDGET - Auth must always be available
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------

  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------

  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------

# SECRETS - Provided via CI/CD or Kubernetes Secrets
# -----------------------------------------------------------------------------
secret:
  label: auth-secret
  SPRING_DATA_MONGODB_URI_AUTH: "" # Provided via GitHub Actions / External Secrets
# -----------------------------------------------------------------------------

# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: auth-config-map
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-svc:80/eureka/
  EUREKA_INSTANCE_HOSTNAME: auth-svc
  LOG_LEVEL: WARN
  # JWT Configuration

  JWT_EXPIRATION_MS: "86400000" # 24 hours
  JWT_REFRESH_EXPIRATION_MS: "604800000" # 7 days
