# =============================================================================
# ORDER SERVICE - PRODUCTION VALUES
# =============================================================================
# CRITICAL: Handles financial transactions and order processing
# Default values are PRODUCTION-READY
# =============================================================================
order:
  label: order
  # ---------------------------------------------------------------------------
  # PRODUCTION: High Availability for transactions
  # ---------------------------------------------------------------------------
  replicas: 3
  containerPort: 9070
  # ---------------------------------------------------------------------------
  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/order-service
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------
  # PRODUCTION RESOURCES - Higher for transaction processing
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # ---------------------------------------------------------------------------
  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------
  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 9070
  # ---------------------------------------------------------------------------
  # POD DISRUPTION BUDGET - Orders must always be available
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------
  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------
  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------
# SECRETS
# -----------------------------------------------------------------------------
secret:
  label: order-secret
  SPRING_DATA_MONGODB_URI_ORDER: "" # Provided via GitHub Actions / External Secrets
# -----------------------------------------------------------------------------
# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: order-config-map
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-svc:80/eureka/
  EUREKA_INSTANCE_HOSTNAME: order-svc
  LOG_LEVEL: WARN
