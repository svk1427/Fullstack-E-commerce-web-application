apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.name }}
  namespace: {{ .Values.ingress.namespace | default "default" }}
  annotations:
    # ==========================================================================
    # AWS ALB - PRODUCTION CONFIGURATION
    # ==========================================================================
    
    # Core Settings
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.alb.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.alb.targetType }}
    alb.ingress.kubernetes.io/listen-ports: '{{ .Values.ingress.alb.listenPorts }}'
    alb.ingress.kubernetes.io/ip-address-type: ipv4
    
    # Security Group
    {{- if .Values.ingress.alb.securityGroups }}
    alb.ingress.kubernetes.io/security-groups: {{ .Values.ingress.alb.securityGroups }}
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    {{- end }}
    
    # SSL/TLS
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- if .Values.ingress.alb.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.alb.certificateArn }}
    {{- end }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    
    # Health Check
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.ingress.alb.healthcheckPath }}
    alb.ingress.kubernetes.io/healthcheck-protocol: {{ .Values.ingress.alb.healthcheckProtocol }}
    alb.ingress.kubernetes.io/healthcheck-port: {{ .Values.ingress.alb.healthcheckPort }}
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '{{ .Values.ingress.alb.healthcheckInterval }}'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '{{ .Values.ingress.alb.healthcheckTimeout }}'
    alb.ingress.kubernetes.io/healthy-threshold-count: '{{ .Values.ingress.alb.healthyThreshold }}'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '{{ .Values.ingress.alb.unhealthyThreshold }}'
    alb.ingress.kubernetes.io/success-codes: '{{ .Values.ingress.alb.successCodes }}'
    
    # Load Balancer Attributes
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      idle_timeout.timeout_seconds={{ .Values.ingress.alb.idleTimeout }},
      deletion_protection.enabled={{ .Values.ingress.alb.deletionProtection }},
      access_logs.s3.enabled={{ .Values.ingress.alb.accessLogsEnabled }}{{- if eq .Values.ingress.alb.accessLogsEnabled "true" }},
      access_logs.s3.bucket={{ .Values.ingress.alb.accessLogsS3Bucket }},
      access_logs.s3.prefix={{ .Values.ingress.alb.accessLogsS3Prefix }}{{- end }},
      routing.http2.enabled=true,
      routing.http.drop_invalid_header_fields.enabled=true,
      routing.http.desync_mitigation_mode=defensive
    
    # Target Group Attributes
    alb.ingress.kubernetes.io/target-group-attributes: >-
      deregistration_delay.timeout_seconds=30,
      stickiness.enabled=false,
      load_balancing.algorithm.type=least_outstanding_requests
    
    # WAF Integration
    {{- if .Values.ingress.alb.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.ingress.alb.wafAclArn }}
    {{- end }}
    
    # Shield Advanced
    {{- if eq .Values.ingress.alb.shieldAdvancedProtection "true" }}
    alb.ingress.kubernetes.io/shield-advanced-protection: "true"
    {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.alb.ingressClassName }}
  rules:
    - http:
        paths:
        {{- range .Values.ingress.rules }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .serviceName }}
                port:
                  number: {{ .servicePort }}
        {{- end }}

