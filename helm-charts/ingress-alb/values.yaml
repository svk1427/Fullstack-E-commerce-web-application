ingress:
  name: purely-ingress
  namespace: default
  # =============================================================================
  # ALB CONFIGURATION - PRODUCTION
  # =============================================================================
  alb:
    scheme: internet-facing
    targetType: ip
    ingressClassName: alb
    listenPorts: '[{"HTTP": 80}, {"HTTPS": 443}]'
    sslRedirect: "true"
    # Security Group (Terraform managed - passed during deployment)
    securityGroups: ""
    # Health Check Configuration
    healthcheckPath: /health
    healthcheckProtocol: HTTP
    healthcheckPort: traffic-port
    healthcheckInterval: "15"
    healthcheckTimeout: "5"
    healthyThreshold: "2"
    unhealthyThreshold: "3"
    successCodes: "200"
    # Load Balancer Attributes
    idleTimeout: "120"
    deletionProtection: "true"
    accessLogsEnabled: "true"
    accessLogsS3Bucket: ""
    accessLogsS3Prefix: "alb-logs"
    # WAF Integration
    wafAclArn: ""
    # Shield Protection
    shieldAdvancedProtection: "false"
  # =============================================================================
  # ROUTING RULES
  # =============================================================================
  rules:
    - path: /
      pathType: Prefix
      serviceName: web-app-svc
      servicePort: 80
    - path: /api
      pathType: Prefix
      serviceName: gateway-svc
      servicePort: 80
