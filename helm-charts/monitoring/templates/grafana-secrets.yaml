# =============================================================================
# GRAFANA - SECRETS
# =============================================================================
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.grafana.label }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.grafana.label }}
type: Opaque
data:
  {{- if .Values.grafana.admin.password }}
  admin-password: {{ .Values.grafana.admin.password | b64enc | quote }}
  {{- else }}
  # Default password: admin (change this in production!)
  admin-password: {{ "admin" | b64enc | quote }}
  {{- end }}
{{- end }}
