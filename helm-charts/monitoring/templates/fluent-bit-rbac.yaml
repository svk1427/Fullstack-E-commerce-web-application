# =============================================================================
# FLUENT BIT - RBAC
# =============================================================================
{{- if .Values.fluentbit.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fluentbit.label }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.fluentbit.label }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.fluentbit.label }}
  labels:
    app: {{ .Values.fluentbit.label }}
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/logs
      - nodes
      - nodes/proxy
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.fluentbit.label }}
  labels:
    app: {{ .Values.fluentbit.label }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.fluentbit.label }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.fluentbit.label }}
    namespace: {{ .Values.global.namespace }}
{{- end }}
