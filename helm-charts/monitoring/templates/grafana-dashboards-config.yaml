# =============================================================================
# GRAFANA - DASHBOARD PROVISIONING CONFIG
# =============================================================================
{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.label }}-dashboards-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.grafana.label }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
{{- end }}
