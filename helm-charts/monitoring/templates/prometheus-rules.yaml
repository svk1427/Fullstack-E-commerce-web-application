# =============================================================================
# PROMETHEUS - ALERTING RULES
# =============================================================================
{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.prometheus.label }}-rules
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.prometheus.label }}
data:
  kubernetes-alerts.yml: |
    groups:
      - name: kubernetes-apps
        rules:
          - alert: KubePodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 * 5 > 3
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is crash looping
              description: Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.container {{ "}}" }}) is restarting {{ "{{" }} printf "%.2f" $value {{ "}}" }} times / 5 minutes.

          - alert: KubePodNotReady
            expr: sum by (namespace, pod) (max by(namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown"}) * on(namespace, pod) group_left(owner_kind) topk by(namespace, pod) (1, max by(namespace, pod, owner_kind) (kube_pod_owner{owner_kind!="Job"}))) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} has been in a non-ready state for more than 15 minutes.

          - alert: KubeDeploymentReplicasMismatch
            expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Deployment {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }} has not matched the expected number of replicas for 10m.

          - alert: KubeContainerWaiting
            expr: sum by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason!~"ContainerCreating|PodInitializing"}) > 0
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: Container {{ "{{" }} $labels.container {{ "}}" }} in pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} has been in waiting state for over an hour.

      - name: kubernetes-resources
        rules:
          - alert: KubeMemoryOvercommit
            expr: sum(namespace_memory:kube_pod_container_resource_requests:sum{}) / sum(kube_node_status_allocatable{resource="memory"}) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Cluster has overcommitted memory resource requests.

          - alert: KubeCPUOvercommit
            expr: sum(namespace_cpu:kube_pod_container_resource_requests:sum{}) / sum(kube_node_status_allocatable{resource="cpu"}) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Cluster has overcommitted CPU resource requests.

          - alert: KubeQuotaAlmostFull
            expr: kube_resourcequota{type="used"} / ignoring(instance, job, type) (kube_resourcequota{type="hard"} > 0) > 0.9
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Namespace {{ "{{" }} $labels.namespace {{ "}}" }} is using {{ "{{" }} $value | humanizePercentage {{ "}}" }} of its {{ "{{" }} $labels.resource {{ "}}" }} quota.

      - name: node-alerts
        rules:
          - alert: NodeHighCPUUsage
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High CPU usage on {{ "{{" }} $labels.instance {{ "}}" }}
              description: CPU usage is above 80% (current value is {{ "{{" }} $value {{ "}}" }}%)

          - alert: NodeHighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High memory usage on {{ "{{" }} $labels.instance {{ "}}" }}
              description: Memory usage is above 80% (current value is {{ "{{" }} $value {{ "}}" }}%)

          - alert: NodeDiskSpaceRunningLow
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Low disk space on {{ "{{" }} $labels.instance {{ "}}" }}
              description: Disk space is below 20% (current value is {{ "{{" }} $value {{ "}}" }}%)

          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Node {{ "{{" }} $labels.node {{ "}}" }} is not ready.

      - name: application-alerts
        rules:
          - alert: HighHTTPErrorRate
            expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High HTTP 5xx error rate for {{ "{{" }} $labels.service {{ "}}" }}
              description: More than 5% of requests are failing with 5xx errors.

          - alert: HighHTTPLatency
            expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High HTTP latency for {{ "{{" }} $labels.service {{ "}}" }}
              description: 95th percentile latency is above 2 seconds.
{{- end }}
