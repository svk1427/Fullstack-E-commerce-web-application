# =============================================================================
# ALERTMANAGER - DEPLOYMENT (OPTIONAL)
# =============================================================================
{{- if .Values.alertmanager.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.alertmanager.label }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alertmanager.label }}
    component: alerting
spec:
  replicas: {{ .Values.alertmanager.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.alertmanager.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.alertmanager.label }}
        component: alerting
    spec:
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: {{ .Values.alertmanager.label }}
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=http://localhost:9093"
          ports:
            - containerPort: 9093
              name: http
              protocol: TCP
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: {{ .Values.alertmanager.label }}-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.alertmanager.label }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alertmanager.label }}
spec:
  type: {{ .Values.alertmanager.service.type }}
  ports:
    - port: {{ .Values.alertmanager.service.port }}
      targetPort: 9093
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.alertmanager.label }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alertmanager.label }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alertmanager.label }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
        - match:
            severity: warning
          receiver: 'warning-receiver'
    
    receivers:
      - name: 'default-receiver'
      {{- if .Values.alertmanager.notifications.slack.enabled }}
      - name: 'critical-receiver'
        slack_configs:
          - api_url: {{ .Values.alertmanager.notifications.slack.webhookUrl | quote }}
            channel: {{ .Values.alertmanager.notifications.slack.channel | quote }}
            send_resolved: true
            title: '{{ "{{" }} template "slack.default.title" . {{ "}}" }}'
            text: '{{ "{{" }} template "slack.default.text" . {{ "}}" }}'
      - name: 'warning-receiver'
        slack_configs:
          - api_url: {{ .Values.alertmanager.notifications.slack.webhookUrl | quote }}
            channel: {{ .Values.alertmanager.notifications.slack.channel | quote }}
            send_resolved: true
      {{- else }}
      - name: 'critical-receiver'
      - name: 'warning-receiver'
      {{- end }}
    
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']
{{- end }}
