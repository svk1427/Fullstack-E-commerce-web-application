# =============================================================================
# FLUENT BIT - DAEMONSET (LOG COLLECTOR)
# =============================================================================
# Runs on every node to collect container logs
# =============================================================================
{{- if .Values.fluentbit.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.fluentbit.label }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.fluentbit.label }}
    component: logging
spec:
  selector:
    matchLabels:
      app: {{ .Values.fluentbit.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.fluentbit.label }}
        component: logging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2020"
        prometheus.io/path: "/api/v1/metrics/prometheus"
    spec:
      serviceAccountName: {{ .Values.fluentbit.label }}
      {{- with .Values.fluentbit.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.fluentbit.label }}
          image: "{{ .Values.fluentbit.image.repository }}:{{ .Values.fluentbit.image.tag }}"
          imagePullPolicy: {{ .Values.fluentbit.image.pullPolicy }}
          ports:
            - containerPort: 2020
              name: metrics
              protocol: TCP
          resources:
            {{- toYaml .Values.fluentbit.resources | nindent 12 }}
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/
            - name: runlog
              mountPath: /run/log
              readOnly: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      terminationGracePeriodSeconds: 10
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: runlog
          hostPath:
            path: /run/log
        - name: fluent-bit-config
          configMap:
            name: {{ .Values.fluentbit.label }}-config
{{- end }}
