# =============================================================================
# MONITORING STACK - VALUES
# =============================================================================
# Configuration for Fluent Bit, Prometheus, and Grafana
# =============================================================================
# Global settings
global:
  namespace: monitoring
  environment: dev
# =============================================================================
# FLUENT BIT - LOG COLLECTOR (DAEMONSET)
# =============================================================================
fluentbit:
  enabled: true
  label: fluent-bit
  image:
    repository: fluent/fluent-bit
    tag: "2.2.2"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Log parsing configuration
  parser:
    # Enable JSON parsing for application logs
    json: true
    # Parse Kubernetes metadata

    kubernetes: true
  # Output destinations
  outputs:
    # Send to Loki for Grafana (if enabled)
    loki:
      enabled: true
      host: loki
      port: 3100
    # Send to Elasticsearch (optional)

    elasticsearch:
      enabled: false
      host: elasticsearch
      port: 9200
    # Output to stdout for debugging

    stdout:
      enabled: false
  # Tolerations to run on all nodes including master
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
# =============================================================================
# LOKI - LOG AGGREGATION
# =============================================================================
loki:
  enabled: true
  label: loki
  image:
    repository: grafana/loki
    tag: "2.9.4"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 3100
  # Storage configuration
  storage:
    enabled: true
    size: 10Gi
    storageClass: gp2
# =============================================================================
# PROMETHEUS - METRICS COLLECTION
# =============================================================================
prometheus:
  enabled: true
  label: prometheus
  image:
    repository: prom/prometheus
    tag: "v2.49.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  service:
    type: ClusterIP
    port: 9090
  # Storage configuration
  storage:
    enabled: true
    size: 20Gi
    storageClass: gp2
    retentionDays: 15
  # Scrape configuration
  scrape:
    # Scrape interval
    interval: 15s
    # Evaluation interval for rules

    evaluationInterval: 15s
  # Enable scraping Kubernetes components
  kubernetesSD:
    enabled: true
    # Scrape pods with prometheus.io annotations

    pods: true
    # Scrape services with prometheus.io annotations

    services: true
    # Scrape node metrics

    nodes: true
    # Scrape kube-state-metrics

    kubeStateMetrics: true
# =============================================================================
# KUBE-STATE-METRICS - KUBERNETES OBJECT METRICS
# =============================================================================
kubeStateMetrics:
  enabled: true
  label: kube-state-metrics
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: "v2.10.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 8081
# =============================================================================
# NODE EXPORTER - NODE METRICS (DAEMONSET)
# =============================================================================
nodeExporter:
  enabled: true
  label: node-exporter
  image:
    repository: prom/node-exporter
    tag: "v1.7.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 9100
  # Host paths to mount
  hostPaths:
    proc: /proc
    sys: /sys
    rootfs: /
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
# =============================================================================
# GRAFANA - VISUALIZATION
# =============================================================================
grafana:
  enabled: true
  label: grafana
  image:
    repository: grafana/grafana
    tag: "10.3.1"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 3000
  # Admin credentials (override in production!)
  admin:
    user: admin
    # Password will be auto-generated if not set

    # Set via --set grafana.admin.password=<password> or secrets
    password: ""
  # Storage for dashboards and data
  storage:
    enabled: true
    size: 5Gi
    storageClass: gp2
  # Pre-configured data sources
  datasources:
    prometheus:
      enabled: true
      url: http://prometheus:9090
    loki:
      enabled: true
      url: http://loki:3100
  # Pre-installed dashboards
  dashboards:
    kubernetes: true
    nodeExporter: true
    fluentBit: true
    customApps: true
# =============================================================================
# ALERTMANAGER - ALERTING (OPTIONAL)
# =============================================================================
alertmanager:
  enabled: false
  label: alertmanager
  image:
    repository: prom/alertmanager
    tag: "v0.26.0"
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 9093
  # Notification configuration
  notifications:
    slack:
      enabled: false
      webhookUrl: ""
      channel: "#alerts"
    email:
      enabled: false
      smtpHost: ""
      smtpPort: 587
      from: ""
      to: ""
# =============================================================================
# INGRESS CONFIGURATION
# =============================================================================
ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  hosts:
    grafana: grafana.example.com
    prometheus: prometheus.example.com
