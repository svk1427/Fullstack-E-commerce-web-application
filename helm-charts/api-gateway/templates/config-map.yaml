apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.label }}
  namespace: {{ .Release.Namespace }}
data:
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: {{ .Values.config.EUREKA_CLIENT_SERVICEURL_DEFAULTZONE | toString | quote }}
  EUREKA_INSTANCE_HOSTNAME: {{ .Values.config.EUREKA_INSTANCE_HOSTNAME | toString | quote }}