# =============================================================================
# API GATEWAY - PRODUCTION VALUES
# =============================================================================
# Default values are PRODUCTION-READY
# For dev/qa, use: helm install -f ../environments/dev/values.yaml
# =============================================================================
gateway:
  label: gateway
  # ---------------------------------------------------------------------------
  # PRODUCTION: High Availability with 3 replicas
  # ---------------------------------------------------------------------------
  replicas: 3
  containerPort: 8080
  # ---------------------------------------------------------------------------
  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/api-gateway
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------
  # PRODUCTION RESOURCES - Optimized for performance
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # ---------------------------------------------------------------------------
  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------
  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 80
  # ---------------------------------------------------------------------------
  # POD DISRUPTION BUDGET - High Availability
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------
  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------
  # POD ANTI-AFFINITY - Spread across nodes
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------
# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: gateway-config-map
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-svc:80/eureka/
  EUREKA_INSTANCE_HOSTNAME: gateway-svc
  LOG_LEVEL: WARN
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_SECOND: "100"
  RATE_LIMIT_BURST_CAPACITY: "200"
