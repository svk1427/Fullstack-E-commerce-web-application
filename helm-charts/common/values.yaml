# =============================================================================
# COMMON HELM CHART - VALUES
# =============================================================================
# Shared resources: Service Accounts, RBAC, Network Policies
# =============================================================================
# =============================================================================
# NETWORK POLICIES
# =============================================================================
# Control pod-to-pod communication (Zero Trust networking)
# Requires: AWS VPC CNI with Network Policy enabled
# =============================================================================
networkPolicies:
  # Enable/disable network policies
  # Set to false for development, true for production
  enabled: false
  # Allow pods to connect to external databases (MongoDB Atlas, RDS, etc.)
  # Set to true if your DB is outside the cluster
  allowExternalDB: true
# =============================================================================
# SERVICE ACCOUNTS
# =============================================================================
# Each service gets its own identity for:
# - Kubernetes API access
# - AWS IAM Roles (IRSA) - no access keys needed!
# - Secret/ConfigMap access control
# =============================================================================
serviceAccounts:
  # ---------------------------------------------------------------------------
  # Gateway Service Account
  # ---------------------------------------------------------------------------
  - name: gateway-sa
    automountToken: true
    # Uncomment to enable AWS access (e.g., for X-Ray, CloudWatch)
  # ---------------------------------------------------------------------------
  # Auth Service Account
  # ---------------------------------------------------------------------------
  - name: auth-sa
    # awsRoleArn: arn:aws:iam::ACCOUNT_ID:role/purely-gateway-role

    automountToken: true
    # Uncomment for AWS Secrets Manager, Cognito, etc.
  # ---------------------------------------------------------------------------
  # Product Service Account
  # ---------------------------------------------------------------------------
  - name: product-sa
    # awsRoleArn: arn:aws:iam::ACCOUNT_ID:role/purely-auth-role

    automountToken: true
    # Uncomment for S3 access (product images)
  # ---------------------------------------------------------------------------
  # Order Service Account
  # ---------------------------------------------------------------------------
  - name: order-sa
    # awsRoleArn: arn:aws:iam::ACCOUNT_ID:role/purely-product-role

    automountToken: true
    # Uncomment for SQS access (order queue)
  # ---------------------------------------------------------------------------
  # Cart Service Account
  # ---------------------------------------------------------------------------
  - name: cart-sa
    # awsRoleArn: arn:aws:iam::ACCOUNT_ID:role/purely-order-role

    automountToken: true
  # ---------------------------------------------------------------------------
  - name: category-sa
    # ---------------------------------------------------------------------------

    # Category Service Account

    automountToken: true
  # ---------------------------------------------------------------------------
  - name: user-sa
    # ---------------------------------------------------------------------------

    # User Service Account

    automountToken: true
  # ---------------------------------------------------------------------------
  - name: notification-sa
    # ---------------------------------------------------------------------------

    # Notification Service Account

    automountToken: true
    # Uncomment for SES access (send emails)
  # ---------------------------------------------------------------------------
  # Service Registry (Eureka) Account
  # ---------------------------------------------------------------------------
  - name: registry-sa
    # awsRoleArn: arn:aws:iam::ACCOUNT_ID:role/purely-notification-role

    automountToken: true
  # ---------------------------------------------------------------------------
  - name: web-app-sa
    # ---------------------------------------------------------------------------

    # Web App Service Account

    automountToken: false # Frontend doesn't need K8s API access
# =============================================================================

# RBAC ROLES
# =============================================================================
# Define permissions for each role
# Principle of Least Privilege: Only grant what's needed
# =============================================================================
roles:
  # ---------------------------------------------------------------------------
  # Read-only access to services and endpoints (for service discovery)
  # ---------------------------------------------------------------------------
  - name: service-discovery-role
    rules:
      - apiGroups: [""]
        resources: ["services", "endpoints", "pods"]
        verbs: ["get", "list", "watch"]
  # ---------------------------------------------------------------------------
  - name: secret-reader-role
    # ---------------------------------------------------------------------------

    # Secret reader role (for services that need secrets)

    rules:
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list"]
  # ---------------------------------------------------------------------------
  - name: configmap-reader-role
    # ---------------------------------------------------------------------------

    # ConfigMap reader role

    rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list", "watch"]
  # ---------------------------------------------------------------------------
  - name: read-all-role
    # ---------------------------------------------------------------------------

    # Full read access (for monitoring/debugging)

    rules:
      - apiGroups: [""]
        resources: ["pods", "services", "endpoints", "configmaps"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["deployments", "replicasets"]
        verbs: ["get", "list", "watch"]
# =============================================================================

# ROLE BINDINGS
# =============================================================================
# Connect service accounts to roles
# =============================================================================
roleBindings:
  # Gateway needs to discover other services
  - name: gateway-service-discovery
    serviceAccount: gateway-sa
    role: service-discovery-role
  - name: auth-secret-reader
    # Auth service reads secrets

    serviceAccount: auth-sa
    role: secret-reader-role
  - name: registry-service-discovery
    # Registry (Eureka) needs to see all services

    serviceAccount: registry-sa
    role: service-discovery-role
  - name: gateway-configmap-reader
    # All services read configmaps

    serviceAccount: gateway-sa
    role: configmap-reader-role
  - name: auth-configmap-reader
    serviceAccount: auth-sa
    role: configmap-reader-role
  - name: product-configmap-reader
    serviceAccount: product-sa
    role: configmap-reader-role
  - name: order-configmap-reader
    serviceAccount: order-sa
    role: configmap-reader-role
  - name: cart-configmap-reader
    serviceAccount: cart-sa
    role: configmap-reader-role
  - name: category-configmap-reader
    serviceAccount: category-sa
    role: configmap-reader-role
  - name: user-configmap-reader
    serviceAccount: user-sa
    role: configmap-reader-role
  - name: notification-configmap-reader
    serviceAccount: notification-sa
    role: configmap-reader-role
# =============================================================================

# TEAM RBAC - USER AND GROUP ACCESS
# =============================================================================
# Define who can access the cluster and what they can do
# Users/Groups come from your identity provider (AWS IAM, OIDC, Okta, etc.)
# =============================================================================
teamRBAC:
  enabled: true
  # ---------------------------------------------------------------------------

  # CLUSTER ADMINS - Full cluster access (use sparingly!)
  # ---------------------------------------------------------------------------
  clusterAdmins:
    users:
    # - "admin@company.com"
    # - "platform-lead@company.com"
    groups:
    # - "platform-admins"
  # ---------------------------------------------------------------------------
  # SRE - Operations and troubleshooting
  # Can: restart pods, exec, view secrets, scale, cordon nodes
  # ---------------------------------------------------------------------------
  sre:
    users:
    # - "sre1@company.com"
    # - "sre2@company.com"
    groups:
    # - "sre-team"
    # - "oncall-engineers"
  # ---------------------------------------------------------------------------
  # DEVOPS - CI/CD and deployments
  # Can: deploy, update configs, manage services
  # Cannot: view secrets content, access nodes
  # ---------------------------------------------------------------------------
  devops:
    users:
    # - "devops1@company.com"
    groups:
    # - "devops-team"
  # ---------------------------------------------------------------------------
  # DEVELOPERS - View and debug
  # Can: view resources, exec into pods, port-forward, view logs
  # Cannot: modify deployments, view secrets
  # ---------------------------------------------------------------------------
  developers:
    users:
    # - "dev1@company.com"
    # - "dev2@company.com"
    groups:
    # - "backend-developers"
    # - "frontend-developers"
  # ---------------------------------------------------------------------------
  # VIEWERS - Read-only access
  # Can: view all resources except secrets
  # Cannot: exec, modify anything
  # ---------------------------------------------------------------------------
  viewers:
    users:
    # - "qa@company.com"
    # - "product-manager@company.com"
    groups:
    # - "qa-team"
    # - "stakeholders"
  # ---------------------------------------------------------------------------
  # NAMESPACE-SPECIFIC BINDINGS
  # For users/groups that only need access to specific namespaces
  # ---------------------------------------------------------------------------
  namespaceBindings:

# Example: Developer access to dev namespace only
# - namespace: purely-dev
#   role: developer
#   user: "junior-dev@company.com"
# Example: Team access to their namespace
# - namespace: purely-staging
#   role: namespace-admin
#   group: "staging-team"
