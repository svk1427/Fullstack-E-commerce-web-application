# =============================================================================
# COMMON SERVICE ACCOUNTS FOR PURELY E-COMMERCE
# =============================================================================
# Service accounts provide identity for pods to:
# 1. Authenticate with Kubernetes API
# 2. Assume AWS IAM roles (IRSA)
# 3. Access secrets and configmaps
# 4. Enable least-privilege security
# =============================================================================

{{- range .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: purely-ecommerce
    app.kubernetes.io/managed-by: helm
  {{- if .awsRoleArn }}
  annotations:
    # AWS IAM Role for Service Account (IRSA)
    # Allows pod to assume AWS IAM role without access keys
    eks.amazonaws.com/role-arn: {{ .awsRoleArn }}
  {{- end }}
automountServiceAccountToken: {{ .automountToken | default true }}
{{- end }}
