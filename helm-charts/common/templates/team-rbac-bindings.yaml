# =============================================================================
# NAMESPACE-SPECIFIC ROLE BINDINGS
# =============================================================================
# For developers/teams that only need access to specific namespaces
{{- range .Values.teamRBAC.namespaceBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: purely-{{ .role }}-{{ .user | default .group | replace "@" "-" | replace "." "-" }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/part-of: purely-ecommerce
    rbac.purely.io/role-type: {{ .role }}
subjects:
  {{- if .user }}
  - kind: User
    name: {{ .user }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
  {{- if .group }}
  - kind: Group
    name: {{ .group }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
roleRef:
  kind: ClusterRole
  name: purely-{{ .role }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- end }}
