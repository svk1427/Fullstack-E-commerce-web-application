# =============================================================================
# TEAM RBAC - CLUSTER ROLE BINDINGS FOR USERS AND GROUPS
# =============================================================================
# Binds ClusterRoles to specific users and groups
# Users/Groups come from your identity provider (AWS IAM, OIDC, etc.)
# =============================================================================

{{- if .Values.teamRBAC.enabled }}

# =============================================================================
# CLUSTER ADMIN BINDINGS
# =============================================================================
{{- range .Values.teamRBAC.clusterAdmins.users }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: purely-cluster-admin-{{ . | replace "@" "-" | replace "." "-" }}
  labels:
    app.kubernetes.io/part-of: purely-ecommerce
    rbac.purely.io/role-type: admin
subjects:
  - kind: User
    name: {{ . }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: purely-cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- range .Values.teamRBAC.clusterAdmins.groups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: purely-cluster-admin-group-{{ . | replace "@" "-" | replace "." "-" }}
  labels:
    app.kubernetes.io/part-of: purely-ecommerce
    rbac.purely.io/role-type: admin
subjects:
  - kind: Group
    name: {{ . }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: purely-cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}

