# =============================================================================
# PRODUCT SERVICE - PRODUCTION VALUES
# =============================================================================
# Handles product catalog - high read traffic expected
# Default values are PRODUCTION-READY
# =============================================================================
product:
  label: product
  # ---------------------------------------------------------------------------

  # Replicas - Reduced for dev/small clusters
  # ---------------------------------------------------------------------------
  replicas: 1
  containerPort: 9010
  # ---------------------------------------------------------------------------

  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/product-service
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------

  # RESOURCES - Reduced for t3.medium nodes
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ---------------------------------------------------------------------------

  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------

  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 9010
  # ---------------------------------------------------------------------------

  # POD DISRUPTION BUDGET
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------

  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------

  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------

# SECRETS
# -----------------------------------------------------------------------------
secret:
  label: product-secret
  SPRING_DATA_MONGODB_URI_PRODUCT: "" # Provided via GitHub Actions / External Secrets
# -----------------------------------------------------------------------------

# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: product-config-map
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-svc:80/eureka/
  EUREKA_INSTANCE_HOSTNAME: product-svc
  LOG_LEVEL: WARN
