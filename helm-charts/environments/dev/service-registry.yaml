# =============================================================================
# SERVICE REGISTRY (EUREKA) - DEVELOPMENT OVERRIDE VALUES
# =============================================================================
# Usage: helm upgrade service-registry ./service-registry -f environments/dev/service-registry.yaml
# =============================================================================
registry:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  affinity:
    enabled: false
config:
  LOG_LEVEL: DEBUG
