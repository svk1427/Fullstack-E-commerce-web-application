# =============================================================================
# ORDER SERVICE - DEVELOPMENT OVERRIDE VALUES
# =============================================================================
# Usage: helm upgrade order-service ./order-service -f environments/dev/order-service.yaml
# =============================================================================
order:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  affinity:
    enabled: false
config:
  LOG_LEVEL: DEBUG
