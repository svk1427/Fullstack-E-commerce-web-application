# =============================================================================
# API GATEWAY - DEVELOPMENT OVERRIDE VALUES
# =============================================================================
# Usage: helm upgrade api-gateway ./api-gateway -f environments/dev/api-gateway.yaml
# =============================================================================
apigateway:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilization: 80
  pdb:
    enabled: false
  affinity:
    enabled: false
config:
  LOG_LEVEL: DEBUG
