# =============================================================================
# USER SERVICE - DEVELOPMENT OVERRIDE VALUES
# =============================================================================
# Usage: helm upgrade user-service ./user-service -f environments/dev/user-service.yaml
# =============================================================================
user:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  affinity:
    enabled: false
config:
  LOG_LEVEL: DEBUG
