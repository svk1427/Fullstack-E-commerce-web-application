# =============================================================================
# API GATEWAY - QA OVERRIDE VALUES
# =============================================================================
# Usage: helm upgrade api-gateway ./api-gateway -f environments/qa/api-gateway.yaml
# =============================================================================
apigateway:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilization: 75
  pdb:
    enabled: true
    minAvailable: 1
  affinity:
    enabled: true
config:
  LOG_LEVEL: INFO
