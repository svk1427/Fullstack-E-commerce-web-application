apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-depl" .Values.registry.label }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.registry.label }}
spec:
  replicas: {{ .Values.registry.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.registry.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.registry.label }}
    spec:
      serviceAccountName: {{ .Values.registry.serviceAccount | default "registry-sa" }}
      containers:
        - name: {{ printf "%s-container" .Values.registry.label }}
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.registry.containerPort }}
          resources:
            requests:
              cpu: {{ .Values.registry.resources.requests.cpu }}
              memory: {{ .Values.registry.resources.requests.memory }}
            limits:
              cpu: {{ .Values.registry.resources.limits.cpu }}
              memory: {{ .Values.registry.resources.limits.memory }}