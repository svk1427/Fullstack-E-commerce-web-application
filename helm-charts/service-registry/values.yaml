# =============================================================================
# SERVICE REGISTRY (EUREKA) - PRODUCTION VALUES
# =============================================================================
# Default values are PRODUCTION-READY
# For dev/qa, use: helm install -f ../environments/dev/values.yaml
# =============================================================================
registry:
  label: registry
  # ---------------------------------------------------------------------------
  # PRODUCTION: High Availability with 3 replicas for Eureka peer replication
  # ---------------------------------------------------------------------------
  replicas: 3
  containerPort: 8761
  # ---------------------------------------------------------------------------
  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/service-registry
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------
  # PRODUCTION RESOURCES
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # ---------------------------------------------------------------------------
  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 5
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------
  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 80
  # ---------------------------------------------------------------------------
  # POD DISRUPTION BUDGET
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------
  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------
  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------
# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: registry-config-map
  SPRING_PROFILES_ACTIVE: prod
  LOG_LEVEL: WARN
