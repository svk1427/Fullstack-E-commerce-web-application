# =============================================================================
# SERVICE REGISTRY (EUREKA) - PRODUCTION VALUES
# =============================================================================
# Default values are PRODUCTION-READY
# For dev/qa, use: helm install -f ../environments/dev/values.yaml
# =============================================================================
registry:
  label: registry
  # ---------------------------------------------------------------------------

  # Replicas - Reduced for dev/small clusters
  # ---------------------------------------------------------------------------
  replicas: 1
  containerPort: 8761
  # ---------------------------------------------------------------------------

  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/service-registry
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------

  # RESOURCES - Reduced for t3.medium nodes
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ---------------------------------------------------------------------------

  # HORIZONTAL POD AUTOSCALER - Disabled for dev/small clusters
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------

  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 80
  # ---------------------------------------------------------------------------

  # POD DISRUPTION BUDGET
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------

  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------

  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------

# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: registry-config-map
  SPRING_PROFILES_ACTIVE: prod
  LOG_LEVEL: WARN
