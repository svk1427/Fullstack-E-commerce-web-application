# =============================================================================
# CART SERVICE - PRODUCTION VALUES
# =============================================================================
# Handles shopping cart - session-critical service
# Default values are PRODUCTION-READY
# =============================================================================
cart:
  label: cart
  # ---------------------------------------------------------------------------
  # PRODUCTION: High Availability for checkout flow
  # ---------------------------------------------------------------------------
  replicas: 3
  containerPort: 9060
  # ---------------------------------------------------------------------------
  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/cart-service
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------
  # PRODUCTION RESOURCES
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  # ---------------------------------------------------------------------------
  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------
  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 9060
  # ---------------------------------------------------------------------------
  # POD DISRUPTION BUDGET
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------
  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------
  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------
# SECRETS
# -----------------------------------------------------------------------------
secret:
  label: cart-secret
  SPRING_DATA_MONGODB_URI_CART: "" # Provided via GitHub Actions / External Secrets
# -----------------------------------------------------------------------------
# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: cart-config-map
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-svc:80/eureka/
  EUREKA_INSTANCE_HOSTNAME: cart-svc
  LOG_LEVEL: WARN
