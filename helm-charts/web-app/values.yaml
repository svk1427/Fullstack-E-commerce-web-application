# =============================================================================
# WEB APP (FRONTEND) - PRODUCTION VALUES
# =============================================================================
# React/Vite frontend served via NGINX
# Default values are PRODUCTION-READY
# =============================================================================
web:
  label: web-app
  # ---------------------------------------------------------------------------

  # Replicas - Reduced for dev/small clusters
  # ---------------------------------------------------------------------------
  replicas: 1
  containerPort: 80
  # ---------------------------------------------------------------------------

  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/web-app
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------

  # RESOURCES - Minimal for NGINX static files
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # ---------------------------------------------------------------------------

  # HORIZONTAL POD AUTOSCALER - Disabled for dev/small clusters
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------

  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 80
  # ---------------------------------------------------------------------------

  # POD DISRUPTION BUDGET
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 2
  # ---------------------------------------------------------------------------

  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # ---------------------------------------------------------------------------

  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------

# CONFIGURATION (Runtime environment)
# -----------------------------------------------------------------------------
config:
  label: web-app-config-map
  # API Gateway URL for frontend to call

  VITE_API_GATEWAY_URL: https://api.yourdomain.com
