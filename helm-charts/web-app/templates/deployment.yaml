apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-depl" .Values.web.label }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.web.label }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.web.label }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Create 1 new pod before killing old
      maxUnavailable: 0    # Never kill old pod until new is ready
  template:
    metadata:
      labels:
        app: {{ .Values.web.label }}
    spec:
      serviceAccountName: {{ .Values.web.serviceAccount | default "web-app-sa" }}
      automountServiceAccountToken: false
      containers:
        - name: {{ printf "%s-container" .Values.web.label }}
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.web.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.web.resources.requests.cpu }}
              memory: {{ .Values.web.resources.requests.memory }}
            limits:
              cpu: {{ .Values.web.resources.limits.cpu }}
              memory: {{ .Values.web.resources.limits.memory }}            