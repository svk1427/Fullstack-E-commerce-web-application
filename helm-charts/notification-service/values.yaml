# =============================================================================
# NOTIFICATION SERVICE - PRODUCTION VALUES
# =============================================================================
# Handles email/SMS notifications
# Default values are PRODUCTION-READY
# =============================================================================
notification:
  label: notification
  # ---------------------------------------------------------------------------

  # Replicas - Reduced for dev/small clusters
  # ---------------------------------------------------------------------------
  replicas: 1
  containerPort: 9020
  # ---------------------------------------------------------------------------

  # IMAGE CONFIGURATION
  # ---------------------------------------------------------------------------
  image:
    repository: 855561838951.dkr.ecr.us-east-1.amazonaws.com/notification-service
    tag: "" # Set by CI/CD pipeline
    pullPolicy: IfNotPresent
  # ---------------------------------------------------------------------------

  # RESOURCES - Reduced for t3.medium nodes
  # ---------------------------------------------------------------------------
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # ---------------------------------------------------------------------------

  # HORIZONTAL POD AUTOSCALER
  # ---------------------------------------------------------------------------
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  # ---------------------------------------------------------------------------

  # SERVICE CONFIGURATION
  # ---------------------------------------------------------------------------
  service:
    type: ClusterIP
    port: 9020
  # ---------------------------------------------------------------------------

  # POD DISRUPTION BUDGET
  # ---------------------------------------------------------------------------
  pdb:
    enabled: true
    minAvailable: 1
  # ---------------------------------------------------------------------------

  # HEALTH CHECKS
  # ---------------------------------------------------------------------------
  healthCheck:
    path: /actuator/health
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # ---------------------------------------------------------------------------

  # POD ANTI-AFFINITY
  # ---------------------------------------------------------------------------
  affinity:
    enabled: true
    topologyKey: kubernetes.io/hostname
# -----------------------------------------------------------------------------

# SECRETS - Email/SMS credentials
# -----------------------------------------------------------------------------
secret:
  label: notification-secret
  SPRING_MAIL_USERNAME: "" # Provided via GitHub Actions / External Secrets
  SPRING_MAIL_PASSWORD: "" # Provided via GitHub Actions / External Secrets
# -----------------------------------------------------------------------------

# CONFIGURATION
# -----------------------------------------------------------------------------
config:
  label: notification-config-map
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-svc:80/eureka/
  EUREKA_INSTANCE_HOSTNAME: notification-svc
  LOG_LEVEL: WARN
  # Email Configuration

  SPRING_MAIL_HOST: smtp.gmail.com
  SPRING_MAIL_PORT: "587"
