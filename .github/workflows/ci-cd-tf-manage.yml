name: "🏗️ Terraform Infrastructure"
# =============================================================================
# TERRAFORM INFRASTRUCTURE MANAGEMENT
# =============================================================================
# Triggers:
#   - Push to main (terraform/** changes) → Auto plan
#   - PR to main (terraform/** changes) → Auto plan  
#   - Manual dispatch → plan/apply/destroy
# =============================================================================
on:
  # Auto-trigger on terraform changes - PLAN ONLY
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
  # Manual trigger for apply/destroy
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - plan-destroy
          - force-unlock
        default: 'plan'
      lock_id:
        description: 'Lock ID for force-unlock (get from error message)'
        required: false
        type: string
        default: ''
      confirm:
        description: 'Type "yes" to confirm apply/destroy (not needed for plan)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target specific resources (comma-separated)'
        required: false
        type: string
        default: ''
permissions:
  id-token: write
  contents: read
env:
  TF_VERSION: 1.11.0
  AWS_REGION: us-east-1
  TF_LOG: WARN
  TF_INPUT: false
  TF_IN_AUTOMATION: true
jobs:
  # ---------------------------------------------------------------------------
  # JOB: Determine Action (auto plan vs manual)
  # ---------------------------------------------------------------------------
  setup:
    name: "📋 Setup"
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.determine.outputs.action }}
      is_manual: ${{ steps.determine.outputs.is_manual }}
    steps:
      - name: "Determine Action"
        id: determine
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
            echo "is_manual=true" >> $GITHUB_OUTPUT
            echo "📝 Manual trigger: ${{ github.event.inputs.action }}"
          else
            echo "action=plan" >> $GITHUB_OUTPUT
            echo "is_manual=false" >> $GITHUB_OUTPUT
            echo "📝 Auto trigger: plan only"
          fi
      - name: "Validate Confirmation"
        if: github.event_name == 'workflow_dispatch'
        run: |
          ACTION="${{ github.event.inputs.action }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [[ "$ACTION" == "apply" || "$ACTION" == "destroy" ]]; then
            if [[ "$CONFIRM" != "yes" ]]; then
              echo "::error::⚠️ DESTRUCTIVE ACTION REQUIRES CONFIRMATION!"
              echo "::error::Type 'yes' in the confirm field to proceed."
              exit 1
            fi
            echo "✅ Confirmation received for $ACTION"
          fi
  # ---------------------------------------------------------------------------
  # JOB: Terraform
  # ---------------------------------------------------------------------------
  terraform:
    name: "🏗️ Terraform ${{ needs.setup.outputs.action }}"
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.action == 'apply' || needs.setup.outputs.action == 'destroy' && 'production' || 'dev' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: terraform/us-east-1
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "🔐 Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔧 Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: "📦 Cache Terraform"
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugins
            .terraform
          key: terraform-${{ env.TF_VERSION }}-${{ hashFiles('**/.terraform.lock.hcl') }}
      - name: "🚀 Terraform Init"
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -upgrade=false
      - name: "✅ Terraform Validate"
        run: terraform validate
      - name: "📋 Terraform Plan"
        if: needs.setup.outputs.action == 'plan'
        run: |
          echo "🔍 Running Terraform Plan..."
          terraform plan -no-color -out=tfplan
      - name: "📋 Terraform Plan (Destroy)"
        if: needs.setup.outputs.action == 'plan-destroy'
        run: |
          echo "⚠️ DESTROY PLAN - Shows what will be deleted"
          terraform plan -destroy -no-color
      - name: "🚀 Terraform Apply"
        if: needs.setup.outputs.action == 'apply'
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║           🚀 APPLYING TERRAFORM CHANGES                       ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          terraform apply -auto-approve -no-color
      - name: "🔥 Terraform Destroy"
        if: needs.setup.outputs.action == 'destroy'
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║           🔥 DESTROYING TERRAFORM RESOURCES                   ║"
          echo "║           ⚠️  THIS IS IRREVERSIBLE!                           ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          terraform destroy -auto-approve -no-color
      - name: "🔓 Force Unlock"
        if: needs.setup.outputs.action == 'force-unlock'
        run: |
          echo "🔓 Releasing state lock: ${{ github.event.inputs.lock_id }}"
          terraform force-unlock -force ${{ github.event.inputs.lock_id }}
      - name: "📝 Summary"
        if: always()
        run: |
          echo "## 🏗️ Terraform Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.setup.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
