name: "🏗️ Terraform Infrastructure"
# =============================================================================
# TERRAFORM INFRASTRUCTURE MANAGEMENT
# =============================================================================
# Triggers:
#   - Push to main (terraform/** changes) → Auto plan
#   - PR to main (terraform/** changes) → Auto plan  
#   - Manual dispatch → plan/apply/destroy
# =============================================================================
on:
  # Auto-trigger on terraform changes - PLAN ONLY
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'bootstrap/**'
  # Manual trigger for apply/destroy

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
          - plan-destroy
          - force-unlock
        default: 'plan'
      lock_id:
        description: 'Lock ID for force-unlock (get from error message)'
        required: false
        type: string
        default: ''
      confirm:
        description: 'Type "yes" to confirm apply/destroy (not needed for plan)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target specific resources (comma-separated)'
        required: false
        type: string
        default: ''
permissions:
  id-token: write
  contents: read
env:
  TF_VERSION: 1.11.0
  AWS_REGION: us-east-1
  TF_LOG: WARN
  TF_INPUT: false
  TF_IN_AUTOMATION: true
jobs:
  # ---------------------------------------------------------------------------
  # JOB: Determine Action (auto plan vs manual)
  # ---------------------------------------------------------------------------
  setup:
    name: "📋 Setup"
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.determine.outputs.action }}
      is_manual: ${{ steps.determine.outputs.is_manual }}
    steps:
      - name: "Determine Action"
        id: determine
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "action=${{ github.event.inputs.action }}" >> $GITHUB_OUTPUT
            echo "is_manual=true" >> $GITHUB_OUTPUT
            echo "📝 Manual trigger: ${{ github.event.inputs.action }}"
          else
            echo "action=plan" >> $GITHUB_OUTPUT
            echo "is_manual=false" >> $GITHUB_OUTPUT
            echo "📝 Auto trigger: plan only"
          fi
      - name: "Validate Confirmation"
        if: github.event_name == 'workflow_dispatch'
        run: |
          ACTION="${{ github.event.inputs.action }}"
          CONFIRM="${{ github.event.inputs.confirm }}"

          if [[ "$ACTION" == "apply" || "$ACTION" == "destroy" ]]; then
            if [[ "$CONFIRM" != "yes" ]]; then
              echo "::error::⚠️ DESTRUCTIVE ACTION REQUIRES CONFIRMATION!"
              echo "::error::Type 'yes' in the confirm field to proceed."
              exit 1
            fi
            echo "✅ Confirmation received for $ACTION"
          fi
  # ---------------------------------------------------------------------------

  # JOB: Terraform
  # ---------------------------------------------------------------------------
  terraform:
    name: "🏗️ Terraform ${{ needs.setup.outputs.action }}"
    runs-on: ubuntu-latest
    needs: setup
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        working-directory: terraform/us-east-1
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "🔐 Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔧 Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: "📦 Cache Terraform"
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugins
            .terraform
          key: terraform-${{ env.TF_VERSION }}-${{ hashFiles('**/.terraform.lock.hcl') }}
      - name: "🚀 Terraform Init"
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -upgrade=false
      - name: "🔑 Configure kubectl for EKS"
        continue-on-error: true
        run: "# Get cluster name from terraform state or variables\nCLUSTER_NAME=\"SAP-dev-eksdemo\"\n\necho \"🔍 Checking if EKS cluster exists: $CLUSTER_NAME\"\n\n# Check if cluster exists and is ACTIVE\nCLUSTER_STATUS=$(aws eks describe-cluster --name \"$CLUSTER_NAME\" --region ${{ env.AWS_REGION }} --query 'cluster.status' --output text 2>/dev/null || echo \"NOT_FOUND\")\n\nif [ \"$CLUSTER_STATUS\" = \"ACTIVE\" ]; then\n  echo \"✅ EKS cluster is ACTIVE, configuring kubectl...\"\n  aws eks update-kubeconfig --name \"$CLUSTER_NAME\" --region ${{ env.AWS_REGION }}\n  \n  # Verify connectivity\n  kubectl cluster-info --request-timeout=10s || echo \"⚠️ kubectl connectivity check failed, continuing...\"\nelse\n  echo \"⚠️ EKS cluster status: $CLUSTER_STATUS - skipping kubectl config\"\n  echo \"   This is expected for first deployment or during cluster transitions\"\nfi\n"
      - name: "✅ Terraform Validate"
        run: terraform validate
      - name: "📋 Terraform Plan"
        if: needs.setup.outputs.action == 'plan'
        run: |
          echo "🔍 Running Terraform Plan..."
          # Run plan and capture exit code
          set +e
          terraform plan -no-color -out=tfplan -detailed-exitcode 2>&1 | tee plan_output.txt
          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Exit codes: 0 = no changes, 1 = error, 2 = changes present
          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "✅ No changes required"
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "📝 Changes detected - plan saved to tfplan"
            exit 0
          else
            echo "❌ Terraform plan failed with exit code: $PLAN_EXIT_CODE"
            echo "--- Full output ---"
            cat plan_output.txt
            exit 1
          fi
      - name: "📋 Terraform Plan (Destroy)"
        if: needs.setup.outputs.action == 'plan-destroy'
        run: |
          echo "⚠️ DESTROY PLAN - Shows what will be deleted"
          set +e
          terraform plan -destroy -no-color 2>&1 | tee destroy_plan_output.txt
          PLAN_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $PLAN_EXIT_CODE -ne 0 ]; then
            echo "❌ Terraform destroy plan failed"
            cat destroy_plan_output.txt
            exit 1
          fi
      - name: "🚀 Terraform Apply"
        if: needs.setup.outputs.action == 'apply'
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║           🚀 APPLYING TERRAFORM CHANGES                       ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          set +e
          terraform apply -auto-approve -no-color 2>&1 | tee apply_output.txt
          APPLY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $APPLY_EXIT_CODE -ne 0 ]; then
            echo "❌ Terraform apply failed"
            cat apply_output.txt
            exit 1
          fi
          echo "✅ Terraform apply completed successfully"
      # =====================================================================
      # PRE-DESTROY CLEANUP - Comprehensive VPC resource cleanup
      # =====================================================================
      - name: "🧹 Pre-Destroy Cleanup"
        if: needs.setup.outputs.action == 'destroy'
        run: "echo \"╔═══════════════════════════════════════════════════════════════╗\"\necho \"║           🧹 PRE-DESTROY CLEANUP                              ║\"\necho \"║           Cleaning up VPC dependencies                        ║\"\necho \"╚═══════════════════════════════════════════════════════════════╝\"\n\n# Get VPC ID from Terraform state\nVPC_ID=$(terraform output -raw vpc_id 2>/dev/null || echo \"\")\n\nif [ -z \"$VPC_ID\" ]; then\n  echo \"⚠️ No VPC ID found in state, skipping cleanup\"\n  exit 0\nfi\n\necho \"Found VPC: $VPC_ID\"\nREGION=\"us-east-1\"\n\n# 1. Delete Load Balancers (ALB/NLB)\necho \"\"\necho \"🔍 Step 1: Finding and deleting Load Balancers...\"\nLB_ARNS=$(aws elbv2 describe-load-balancers --region $REGION \\\n  --query \"LoadBalancers[?VpcId=='$VPC_ID'].LoadBalancerArn\" --output text 2>/dev/null || echo \"\")\n\nif [ -n \"$LB_ARNS\" ] && [ \"$LB_ARNS\" != \"None\" ]; then\n  for LB_ARN in $LB_ARNS; do\n    echo \"  Deleting Load Balancer: $LB_ARN\"\n    aws elbv2 delete-load-balancer --load-balancer-arn \"$LB_ARN\" --region $REGION 2>/dev/null || true\n  done\n  echo \"  Waiting 30s for Load Balancers to delete...\"\n  sleep 30\nelse\n  echo \"  No Load Balancers found\"\nfi\n\n# 2. Delete NAT Gateways\necho \"\"\necho \"🔍 Step 2: Finding and deleting NAT Gateways...\"\nNAT_GW_IDS=$(aws ec2 describe-nat-gateways --region $REGION \\\n  --filter \"Name=vpc-id,Values=$VPC_ID\" \"Name=state,Values=available,pending\" \\\n  --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null || echo \"\")\n\nif [ -n \"$NAT_GW_IDS\" ] && [ \"$NAT_GW_IDS\" != \"None\" ]; then\n  for NAT_ID in $NAT_GW_IDS; do\n    echo \"  Deleting NAT Gateway: $NAT_ID\"\n    aws ec2 delete-nat-gateway --nat-gateway-id \"$NAT_ID\" --region $REGION 2>/dev/null || true\n  done\n  echo \"  Waiting 90s for NAT Gateways to delete...\"\n  sleep 90\nelse\n  echo \"  No NAT Gateways found\"\nfi\n\n# 3. Release Elastic IPs\necho \"\"\necho \"🔍 Step 3: Releasing Elastic IPs...\"\n# First disassociate, then release\nEIP_ALLOCS=$(aws ec2 describe-addresses --region $REGION \\\n  --query 'Addresses[].AllocationId' --output text 2>/dev/null || echo \"\")\n\nif [ -n \"$EIP_ALLOCS\" ] && [ \"$EIP_ALLOCS\" != \"None\" ]; then\n  for ALLOC_ID in $EIP_ALLOCS; do\n    echo \"  Releasing EIP: $ALLOC_ID\"\n    # Disassociate first if associated\n    ASSOC_ID=$(aws ec2 describe-addresses --allocation-ids \"$ALLOC_ID\" --region $REGION \\\n      --query 'Addresses[0].AssociationId' --output text 2>/dev/null || echo \"\")\n    if [ -n \"$ASSOC_ID\" ] && [ \"$ASSOC_ID\" != \"None\" ]; then\n      aws ec2 disassociate-address --association-id \"$ASSOC_ID\" --region $REGION 2>/dev/null || true\n    fi\n    aws ec2 release-address --allocation-id \"$ALLOC_ID\" --region $REGION 2>/dev/null || true\n  done\nelse\n  echo \"  No EIPs found\"\nfi\n\n# 4. Delete VPC Endpoints\necho \"\"\necho \"🔍 Step 4: Deleting VPC Endpoints...\"\nVPCE_IDS=$(aws ec2 describe-vpc-endpoints --region $REGION \\\n  --filters \"Name=vpc-id,Values=$VPC_ID\" \\\n  --query 'VpcEndpoints[].VpcEndpointId' --output text 2>/dev/null || echo \"\")\n\nif [ -n \"$VPCE_IDS\" ] && [ \"$VPCE_IDS\" != \"None\" ]; then\n  for VPCE_ID in $VPCE_IDS; do\n    echo \"  Deleting VPC Endpoint: $VPCE_ID\"\n    aws ec2 delete-vpc-endpoints --vpc-endpoint-ids \"$VPCE_ID\" --region $REGION 2>/dev/null || true\n  done\nelse\n  echo \"  No VPC Endpoints found\"\nfi\n\n# 5. Detach and delete ENIs\necho \"\"\necho \"🔍 Step 5: Cleaning up Network Interfaces...\"\nENI_IDS=$(aws ec2 describe-network-interfaces --region $REGION \\\n  --filters \"Name=vpc-id,Values=$VPC_ID\" \\\n  --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || echo \"\")\n\nif [ -n \"$ENI_IDS\" ] && [ \"$ENI_IDS\" != \"None\" ]; then\n  for ENI_ID in $ENI_IDS; do\n    # Get attachment info\n    ATTACH_ID=$(aws ec2 describe-network-interfaces --network-interface-ids \"$ENI_ID\" --region $REGION \\\n      --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text 2>/dev/null || echo \"\")\n    \n    if [ -n \"$ATTACH_ID\" ] && [ \"$ATTACH_ID\" != \"None\" ]; then\n      echo \"  Detaching ENI: $ENI_ID\"\n      aws ec2 detach-network-interface --attachment-id \"$ATTACH_ID\" --force --region $REGION 2>/dev/null || true\n      sleep 5\n    fi\n    \n    echo \"  Deleting ENI: $ENI_ID\"\n    aws ec2 delete-network-interface --network-interface-id \"$ENI_ID\" --region $REGION 2>/dev/null || true\n  done\nelse\n  echo \"  No ENIs found\"\nfi\n\n# 6. Delete Security Groups (except default)\necho \"\"\necho \"🔍 Step 6: Deleting Security Groups...\"\nSG_IDS=$(aws ec2 describe-security-groups --region $REGION \\\n  --filters \"Name=vpc-id,Values=$VPC_ID\" \\\n  --query \"SecurityGroups[?GroupName!='default'].GroupId\" --output text 2>/dev/null || echo \"\")\n\nif [ -n \"$SG_IDS\" ] && [ \"$SG_IDS\" != \"None\" ]; then\n  # First remove all ingress/egress rules that reference other SGs\n  for SG_ID in $SG_IDS; do\n    echo \"  Clearing rules from SG: $SG_ID\"\n    # Get and revoke ingress rules\n    aws ec2 describe-security-groups --group-ids \"$SG_ID\" --region $REGION \\\n      --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null | \\\n      jq -c '.[]' 2>/dev/null | while read -r rule; do\n        aws ec2 revoke-security-group-ingress --group-id \"$SG_ID\" --ip-permissions \"$rule\" --region $REGION 2>/dev/null || true\n      done\n    # Get and revoke egress rules\n    aws ec2 describe-security-groups --group-ids \"$SG_ID\" --region $REGION \\\n      --query 'SecurityGroups[0].IpPermissionsEgress' --output json 2>/dev/null | \\\n      jq -c '.[]' 2>/dev/null | while read -r rule; do\n        aws ec2 revoke-security-group-egress --group-id \"$SG_ID\" --ip-permissions \"$rule\" --region $REGION 2>/dev/null || true\n      done\n  done\n  \n  # Now delete the security groups\n  for SG_ID in $SG_IDS; do\n    echo \"  Deleting SG: $SG_ID\"\n    aws ec2 delete-security-group --group-id \"$SG_ID\" --region $REGION 2>/dev/null || true\n  done\nelse\n  echo \"  No Security Groups to delete\"\nfi\n\necho \"\"\necho \"✅ Pre-destroy cleanup completed\"\necho \"   Waiting 30s for AWS to propagate changes...\"\nsleep 30\n"
      - name: "🔥 Terraform Destroy"
        if: needs.setup.outputs.action == 'destroy'
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║           🔥 DESTROYING TERRAFORM RESOURCES                   ║"
          echo "║           ⚠️  THIS IS IRREVERSIBLE!                           ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          set +e
          terraform destroy -auto-approve -no-color 2>&1 | tee destroy_output.txt
          DESTROY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $DESTROY_EXIT_CODE -ne 0 ]; then
            echo "❌ Terraform destroy failed"
            cat destroy_output.txt
            exit 1
          fi
          echo "✅ Terraform destroy completed successfully"
      - name: "🔓 Force Unlock"
        if: needs.setup.outputs.action == 'force-unlock'
        run: |
          echo "🔓 Releasing state lock: ${{ github.event.inputs.lock_id }}"
          terraform force-unlock -force ${{ github.event.inputs.lock_id }}
      - name: "📝 Summary"
        if: always()
        run: |
          echo "## 🏗️ Terraform Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Action | ${{ needs.setup.outputs.action }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
