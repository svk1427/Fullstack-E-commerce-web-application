name: "CI/CD - MongoDB"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - preprod
          - prod
env:
  AWS_REGION: us-east-1
  HELM_VERSION: "3.14.0"
jobs:
  deploy:
    name: "Deploy MongoDB"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "🔑 Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🗄️ Deploy MongoDB"
        run: |
          # Set namespace based on environment
          case "${{ github.event.inputs.environment }}" in
            dev) NAMESPACE="ecommerce" ;;
            qa) NAMESPACE="ecommerce-qa" ;;
            preprod) NAMESPACE="ecommerce-preprod" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
            *) NAMESPACE="ecommerce" ;;
          esac

          echo "🚀 Deploying MongoDB to namespace: ${NAMESPACE}"

          helm upgrade --install mongodb helm-charts/mongodb \
            --namespace ${NAMESPACE} \
            --create-namespace \
            --atomic \
            --timeout 5m
      - name: "✅ Verify Deployment"
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev) NAMESPACE="ecommerce" ;;
            qa) NAMESPACE="ecommerce-qa" ;;
            preprod) NAMESPACE="ecommerce-preprod" ;;
            prod) NAMESPACE="ecommerce-prod" ;;
            *) NAMESPACE="ecommerce" ;;
          esac

          kubectl rollout status deployment/mongodb -n ${NAMESPACE} --timeout=300s

          echo ""
          echo "✅ MongoDB deployed successfully!"
          echo ""
          echo "📝 MongoDB Connection URI for your services:"
          echo "mongodb://admin:adminpassword123@mongodb-svc:27017/<database_name>?authSource=admin"
          echo ""
          echo "Example URIs to set in GitHub Secrets:"
          echo "SPRING_DATA_MONGODB_URI_AUTH=mongodb://admin:adminpassword123@mongodb-svc:27017/auth_db?authSource=admin"
          echo "SPRING_DATA_MONGODB_URI_CART=mongodb://admin:adminpassword123@mongodb-svc:27017/cart_db?authSource=admin"
          echo "SPRING_DATA_MONGODB_URI_PRODUCT=mongodb://admin:adminpassword123@mongodb-svc:27017/product_db?authSource=admin"
          echo "SPRING_DATA_MONGODB_URI_CATEGORY=mongodb://admin:adminpassword123@mongodb-svc:27017/category_db?authSource=admin"
          echo "SPRING_DATA_MONGODB_URI_ORDER=mongodb://admin:adminpassword123@mongodb-svc:27017/order_db?authSource=admin"
          echo "SPRING_DATA_MONGODB_URI_USER=mongodb://admin:adminpassword123@mongodb-svc:27017/user_db?authSource=admin"
