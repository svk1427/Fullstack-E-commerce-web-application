# =============================================================================
# AUTH SERVICE - MULTI-ENVIRONMENT CI/CD PIPELINE
# =============================================================================
# Handles authentication and JWT token management
# Triggers: 
#   - Push to main → Deploy to PROD (ecommerce namespace)
#   - Manual dispatch → Deploy to selected environment
# Namespaces: dev, qa, preprod, ecommerce (prod)
# =============================================================================
name: "🔐 Auth Service CI/CD"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - qa
          - preprod
          - prod
  push:
    branches: [main]
    paths:
      - 'microservice-backend/auth-service/**'
      - 'helm-charts/auth-service/**'
env:
  SERVICE_NAME: auth-service
  SERVICE_PATH: microservice-backend/auth-service
  HELM_CHART_PATH: helm-charts/auth-service
  HELM_VALUE_KEY: auth
  JAVA_VERSION: '17'
  HELM_VERSION: '3.14.0'
  AWS_REGION: us-east-1
jobs:
  build-and-deploy:
    name: "🔨 Build & Deploy"
    runs-on: ubuntu-latest
    environment: ${{ (github.event.inputs.environment == 'prod' || github.event.inputs.environment == '' || github.event.inputs.environment == 'preprod') && 'production' || github.event.inputs.environment }}
    steps:
      - name: "📋 Set Environment Variables"
        id: env-setup
        run: |
          # Determine target environment
          INPUT_ENV="${{ github.event.inputs.environment }}"
          TARGET_ENV="${INPUT_ENV:-prod}"

          # Map environment to Kubernetes namespace
          # prod → ecommerce, preprod → preprod, others stay same
          if [ "$TARGET_ENV" == "prod" ]; then
            K8S_NAMESPACE="ecommerce"
          else
            K8S_NAMESPACE="$TARGET_ENV"
          fi

          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "k8s_namespace=$K8S_NAMESPACE" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

          echo "🎯 Target: $TARGET_ENV → Namespace: $K8S_NAMESPACE"
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: "🔍 Build & Test"
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "🐳 Build & Push Image"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.env-setup.outputs.short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_AUTH_REPOSITORY }}:$IMAGE_TAG ${{ env.SERVICE_PATH }}
          docker push $ECR_REGISTRY/${{ secrets.ECR_AUTH_REPOSITORY }}:$IMAGE_TAG
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🚀 Deploy to ${{ steps.env-setup.outputs.k8s_namespace }}"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.env-setup.outputs.short_sha }}
          TARGET_ENV: ${{ steps.env-setup.outputs.target_env }}
          K8S_NAMESPACE: ${{ steps.env-setup.outputs.k8s_namespace }}
        run: |
          # Check for environment override file
          ENV_FILE="helm-charts/environments/${TARGET_ENV}/${{ env.SERVICE_NAME }}.yaml"

          # Build helm command
          HELM_CMD="helm upgrade --install ${{ env.SERVICE_NAME }} ${{ env.HELM_CHART_PATH }}"
          HELM_CMD="$HELM_CMD --namespace ${K8S_NAMESPACE} --create-namespace"

          # Add environment-specific values file if exists
          if [ -f "$ENV_FILE" ]; then
            echo "📁 Using environment override: $ENV_FILE"
            HELM_CMD="$HELM_CMD -f $ENV_FILE"
          else
            echo "📁 Using base values (production defaults)"
          fi

          # Add common settings
          HELM_CMD="$HELM_CMD --set ${{ env.HELM_VALUE_KEY }}.image.repository=$ECR_REGISTRY/${{ secrets.ECR_AUTH_REPOSITORY }}"
          HELM_CMD="$HELM_CMD --set ${{ env.HELM_VALUE_KEY }}.image.tag=$IMAGE_TAG"
          HELM_CMD="$HELM_CMD --set secret.SPRING_DATA_MONGODB_URI_AUTH=${{ secrets.SPRING_DATA_MONGODB_URI_AUTH }}"
          HELM_CMD="$HELM_CMD --wait --timeout 5m"

          echo "🚀 Deploying to namespace: ${K8S_NAMESPACE}"
          $HELM_CMD
      - name: "✅ Verify Deployment"
        env:
          K8S_NAMESPACE: ${{ steps.env-setup.outputs.k8s_namespace }}
        run: kubectl rollout status deployment/auth-depl -n ${K8S_NAMESPACE} --timeout=300s
