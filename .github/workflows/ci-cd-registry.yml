# =============================================================================
# SERVICE REGISTRY (EUREKA) - PRODUCTION CI/CD PIPELINE
# =============================================================================
# Critical infrastructure service - must be deployed first
# Handles service discovery for all microservices
# Triggers: Push to main (auto), Manual dispatch
# Environment: PRODUCTION ONLY
# =============================================================================
name: "📡 Service Registry CI/CD"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'microservice-backend/service-registry/**'
      - 'helm-charts/service-registry/**'
env:
  SERVICE_NAME: service-registry
  SERVICE_PATH: microservice-backend/service-registry
  HELM_CHART_PATH: helm-charts/service-registry
  HELM_VALUE_KEY: registry
  JAVA_VERSION: '17'
  HELM_VERSION: '3.14.0'
  AWS_REGION: us-east-1
jobs:
  build-and-deploy:
    name: "🔨 Build & Deploy to PROD"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "📋 Set Variables"
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: "🔍 Build & Test"
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "🐳 Build & Push Image"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }}:$IMAGE_TAG ${{ env.SERVICE_PATH }}
          docker push $ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }}:$IMAGE_TAG
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🚀 Deploy to PRODUCTION"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          helm upgrade --install ${{ env.SERVICE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace prod --create-namespace \
            --set ${{ env.HELM_VALUE_KEY }}.image.repository=$ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }} \
            --set ${{ env.HELM_VALUE_KEY }}.image.tag=$IMAGE_TAG \
            --wait --timeout 5m
      - name: "✅ Verify Eureka Ready"
        run: |
          kubectl rollout status deployment/registry-depl -n prod --timeout=300s
          echo "Waiting for Eureka to be fully operational..."
          sleep 30
          kubectl get pods -n prod -l app=registry
