# =============================================================================
# SERVICE REGISTRY (EUREKA) - ENTERPRISE CI/CD PIPELINE
# =============================================================================
# Critical infrastructure service - must be deployed first
# Handles service discovery for all microservices
# =============================================================================
name: "📡 Service Registry CI/CD"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
  pull_request:
    branches: [main, develop]
    paths:
      - 'microservice-backend/service-registry/**'
      - 'helm-charts/service-registry/**'
      - '.github/workflows/ci-cd-registry.yml'
  push:
    branches: [main]
    paths:
      - 'microservice-backend/service-registry/**'
      - 'helm-charts/service-registry/**'
env:
  SERVICE_NAME: service-registry
  SERVICE_PATH: microservice-backend/service-registry
  HELM_CHART_PATH: helm-charts/service-registry
  HELM_VALUE_KEY: registry
  JAVA_VERSION: '17'
  HELM_VERSION: '3.14.0'
  AWS_REGION: us-east-1
jobs:
  build:
    name: "🔨 Build & Test"
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "📋 Set Variables"
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: "☕ Setup Java"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: "🔍 Build & Test"
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          chmod +x mvnw
          ./mvnw clean verify -B
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "🐳 Build & Push Image"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }}:$IMAGE_TAG ${{ env.SERVICE_PATH }}
          docker push $ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }}:$IMAGE_TAG
  deploy-dev:
    name: "🚀 Deploy to DEV"
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    environment: dev
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🚀 Deploy"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.short_sha }}
        run: |
          helm upgrade --install ${{ env.SERVICE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace dev --create-namespace \
            -f helm-charts/environments/dev/${{ env.SERVICE_NAME }}.yaml \
            --set ${{ env.HELM_VALUE_KEY }}.image.repository=$ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }} \
            --set ${{ env.HELM_VALUE_KEY }}.image.tag=$IMAGE_TAG \
            --wait --timeout 5m
      - name: "✅ Verify Eureka Ready"
        run: |
          kubectl rollout status deployment/registry-depl -n dev --timeout=300s
          echo "Waiting for Eureka to be fully operational..."
          sleep 30
          kubectl get pods -n dev -l app=registry
  deploy-qa:
    name: "🧪 Deploy to QA"
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'qa'
    environment: qa
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🚀 Deploy"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.short_sha }}
        run: |
          helm upgrade --install ${{ env.SERVICE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace qa --create-namespace \
            -f helm-charts/environments/qa/${{ env.SERVICE_NAME }}.yaml \
            --set ${{ env.HELM_VALUE_KEY }}.image.repository=$ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }} \
            --set ${{ env.HELM_VALUE_KEY }}.image.tag=$IMAGE_TAG \
            --wait --timeout 5m
  deploy-prod:
    name: "🏭 Deploy to PRODUCTION"
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    environment: production
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "⚠️ Critical Infrastructure Warning"
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║    ⚠️  CRITICAL: SERVICE REGISTRY DEPLOYMENT ⚠️               ║"
          echo "║    This affects ALL microservices in production!              ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🚀 Deploy"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.short_sha }}
        run: |
          helm upgrade --install ${{ env.SERVICE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace prod --create-namespace \
            --set ${{ env.HELM_VALUE_KEY }}.image.repository=$ECR_REGISTRY/${{ secrets.ECR_REGISTRY_REPOSITORY }} \
            --set ${{ env.HELM_VALUE_KEY }}.image.tag=$IMAGE_TAG \
            --wait --timeout 10m
      - name: "✅ Verify Production Eureka"
        run: |
          kubectl rollout status deployment/registry-depl -n prod --timeout=300s
          echo "Eureka production deployment successful!"
