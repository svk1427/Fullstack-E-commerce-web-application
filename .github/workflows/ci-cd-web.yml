# =============================================================================
# WEB APPLICATION (FRONTEND) - PRODUCTION CI/CD PIPELINE
# =============================================================================
# React/Vite Frontend with NGINX
# Triggers: Push to main (auto), Manual dispatch
# Environment: PRODUCTION ONLY
# =============================================================================
name: "🌐 Web App CI/CD"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'helm-charts/web-app/**'
env:
  SERVICE_NAME: web-app
  SERVICE_PATH: frontend
  HELM_CHART_PATH: helm-charts/web-app
  HELM_VALUE_KEY: web
  NODE_VERSION: '20'
  HELM_VERSION: '3.14.0'
  AWS_REGION: us-east-1
jobs:
  build-and-deploy:
    name: "🔨 Build & Deploy to PROD"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
      - name: "📋 Set Variables"
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
      - name: "📦 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/package-lock.json
      - name: "📥 Install Dependencies"
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm ci
      - name: "🔍 Lint Code"
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm run lint --if-present
      - name: "🧪 Run Tests"
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm test --if-present
      - name: "🏗️ Build Application"
        working-directory: ${{ env.SERVICE_PATH }}
        run: npm run build
      - name: "🔐 Configure AWS"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "🔑 Login to ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: "🐳 Build & Push Image"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ secrets.ECR_WEB_REPOSITORY }}:$IMAGE_TAG ${{ env.SERVICE_PATH }}
          docker push $ECR_REGISTRY/${{ secrets.ECR_WEB_REPOSITORY }}:$IMAGE_TAG
      - name: "☸️ Update Kubeconfig"
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}
      - name: "⚓ Setup Helm"
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: "🚀 Deploy to PRODUCTION"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.short_sha }}
        run: |
          helm upgrade --install ${{ env.SERVICE_NAME }} ${{ env.HELM_CHART_PATH }} \
            --namespace prod --create-namespace \
            --set ${{ env.HELM_VALUE_KEY }}.image.repository=$ECR_REGISTRY/${{ secrets.ECR_WEB_REPOSITORY }} \
            --set ${{ env.HELM_VALUE_KEY }}.image.tag=$IMAGE_TAG \
            --wait --timeout 5m
      - name: "✅ Verify Deployment"
        run: kubectl rollout status deployment/web-app-depl -n prod --timeout=300s
